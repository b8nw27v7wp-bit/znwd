server:
  # 默认只监听本机（展厅内网部署时用 .env 显式改 HOST=0.0.0.0）
  address: ${HOST:127.0.0.1}
  port: ${PORT:8787}
  compression:
    enabled: true
  shutdown: graceful
  error:
    # 统一错误信封由 GlobalExceptionHandler 处理，关掉 Spring 默认错误页
    whitelabel:
      enabled: false

spring:
  application:
    name: znwd-hostess
  lifecycle:
    timeout-per-shutdown-phase: 8s
  mvc:
    # 未知路由也走统一错误信封（否则返回框架默认体）
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  sql:
    init:
      # 建表不放这里：Spring 的 sql.init 在「连不上库」时不受 continue-on-error 保护，会把整个上下文打挂。
      # 改由 DatabaseStatus.check() 在库可达时用 ResourceDatabasePopulator 执行 schema.sql（幂等）。
      mode: never
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:znwd}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&sslMode=${DB_SSL_MODE:DISABLED}&allowPublicKeyRetrieval=${DB_ALLOW_PUBLIC_KEY_RETRIEVAL:true}&rewriteBatchedStatements=true
    username: ${DB_USER:znwd}
    password: ${DB_PASSWORD:}
    hikari:
      pool-name: znwd-pool
      maximum-pool-size: ${DB_POOL_SIZE:8}
      # 0 = 不后台维持空闲连接：库不可用时否则 connection-adder 每 65 秒重试一次，
      # 每次都打一条 WARN + 完整堆栈（同一原因重复刷屏，把真正的日志淹掉）。
      # 代价是库可用时首请求现建一条连接（毫秒级），展厅场景可忽略。
      minimum-idle: 0
      connection-timeout: 3000
      idle-timeout: 300000
      max-lifetime: 1500000
      # -1 = 连接失败不在启动期抛错，改为首次用时重试（配合上面的 continue-on-error）
      initialization-fail-timeout: -1
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 10

logging:
  level:
    root: INFO
    com.znwd.hostess: INFO
    # 库不可用时，Hikari 每次建连失败都由 PoolBase 打一条 WARN + 完整堆栈（同一根因反复刷屏）。
    # 根因在启动时已报一次、/api/health 的 storageAvailable 也如实上报，这里只压掉每次重探的噪声；
    # 连接池自身的其它告警（HikariPool：池耗尽/取连接超时）保持默认级别不动。
    com.zaxxer.hikari.pool.PoolBase: ERROR
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{28} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# —— 业务配置（默认值与原 Node 版一致；.env 可覆盖，系统环境变量优先级最高）——
znwd:
  knowledge-dir: ${KNOWLEDGE_DIR:./knowledge}
  index-dir: ${INDEX_DIR:./server/indexes}
  data-dir: ${DATA_DIR:./server/data}
  watch-knowledge: ${KNOWLEDGE_WATCH:false}
  min-relevance-score: ${MIN_RELEVANCE_SCORE:6.3}
  # 语义向量兜底阈值：关键词没过阈值时，余弦 ≥ 它才放行。
  # 当前 0.75 = 「关闭兜底」：标定（2026-09-23，真 bge-m3 向量）显示域外最高余弦 0.6826
  # （「扫地机器人多少钱？」）高于待救的误拦用例（probe-64 0.6389 / probe-75 0.6725），
  # 区间不成立——开口子必然先把域外问题放进来。语义向量因此只参与排序融合（RRF），不单独放行。
  # 误拦改用补语料/补同义词解决；补完重跑 calibrate，看 vectorHatchSeparated 再决定要不要开口子。
  min-vector-score: ${MIN_VECTOR_SCORE:0.75}
  chat-rate-per-min: ${CHAT_RATE_PER_MIN:30}
  # /api/feedback 的独立限流（次/分钟/IP）：公开写口，比问答严，防止刷统计
  feedback-rate-per-min: ${FEEDBACK_RATE_PER_MIN:10}
  answer-cache-size: ${ANSWER_CACHE_SIZE:200}
  uncovered-log-size: ${UNCOVERED_LOG_SIZE:50}
  admin-token: ${ADMIN_TOKEN:}
  # 未配置 ADMIN_TOKEN 时默认 fail-closed；仅显式关闭此项的开发环境才允许回环免口令
  require-admin-token: ${REQUIRE_ADMIN_TOKEN:true}
  # 生产/预发标记：production|prod|staging 且未配 ADMIN_TOKEN 时，管理接口一律 401（与旧实现一致）。
  # 必须显式绑到 NODE_ENV：record 字段名是 nodeEnv，relaxed binding 只会去找 znwd.node-env，
  # 而 .env / 系统环境里的 NODE_ENV 是另一条独立键，绑不上就静默失效（编译、启动、单测都不报错）。
  node-env: ${NODE_ENV:}
  no-hit-llm: ${NO_HIT_LLM:false}
  log-max-bytes: ${LOG_MAX_BYTES:5000000}
  log-message-mode: ${LOG_MESSAGE_MODE:hash}
  cors-origins: ${CORS_ORIGINS:}
  # 是否信任 X-Forwarded-For 作为限流键：默认 false（那个头客户端可写，采信它=限流可被绕过）。
  # 只有确认前面挂着自家反代且反代会剥离同名头时才设为 true。
  trust-forwarded-for: ${TRUST_FORWARDED_FOR:false}
  # Prompt 外置（rag/PromptStore）：留空 = 打包内置文本（classpath resources/prompts/*.txt）；
  # 填外部文件路径（UTF-8）则覆盖对应文本，现场改措辞不必重编译发版，POST /api/knowledge/reload 重读。
  # 文件缺失/空白/读失败会记日志并回退内置文本，不会中断问答。
  prompt:
    system-path: ${PROMPT_SYSTEM_PATH:}
    no-hit-hint-path: ${PROMPT_NO_HIT_HINT_PATH:}
    no-hit-reply-path: ${PROMPT_NO_HIT_REPLY_PATH:}
  llm:
    provider: ${LLM_PROVIDER:mock}
    base-url: ${LLM_BASE_URL:}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:}
    timeout-ms: ${LLM_TIMEOUT_MS:90000}
    stream-timeout-ms: ${LLM_STREAM_TIMEOUT_MS:180000}
    max-retries: ${LLM_MAX_RETRIES:2}
    retry-base-ms: ${LLM_RETRY_BASE_MS:1000}
    # 0 = 不限制（对应原版未设置 LLM_MAX_TOKENS）
    max-tokens: ${LLM_MAX_TOKENS:0}
    extra-body: ${LLM_EXTRA_BODY:}
  embed:
    provider: ${EMBED_PROVIDER:bag}
    base-url: ${EMBED_BASE_URL:}
    api-key: ${EMBED_API_KEY:}
    model: ${EMBED_MODEL:}
    dims: ${EMBED_DIMS:0}
    bag-dims: ${EMBED_BAG_DIMS:512}
    timeout-ms: ${EMBED_TIMEOUT_MS:60000}
    # 单请求向量化条数上限。云 embedding 服务各有上限（阿里云百炼 10、硅基流动 32），
    # 超一条整个请求 400（不是截断），所以必须可配。换 provider 时先看它的批次上限。
    batch-size: ${EMBED_BATCH_SIZE:32}
  # 语音（TTS 播报 + ASR 识音）。默认关闭：不配就完全不碰外部语音接口，
  # 前端自动退回浏览器内置播报。启用只需 AUDIO_PROVIDER=mimo——AUDIO_BASE_URL/AUDIO_API_KEY
  # 留空即回落 LLM_BASE_URL/LLM_API_KEY（小米 MiMo 的语音与对话同网关同 key）。
  audio:
    provider: ${AUDIO_PROVIDER:none}
    base-url: ${AUDIO_BASE_URL:}
    api-key: ${AUDIO_API_KEY:}
    # 播报音色：预置音色 冰糖/茉莉/苏打/白桦/Mia/Chloe/Milo/Dean，或 mimo_default
    voice: ${AUDIO_VOICE:冰糖}
    # 风格指令（走 user 消息，不会被念出来）
    style: ${AUDIO_STYLE:用中文，语气亲切自然，语速稍慢，像展厅讲解员。}
    tts-model: ${AUDIO_TTS_MODEL:mimo-v2.5-tts}
    asr-model: ${AUDIO_ASR_MODEL:mimo-v2.5-asr}
    # auto / zh / en：展厅以中文为主，默认 zh 更稳
    asr-language: ${AUDIO_ASR_LANGUAGE:zh}
    timeout-ms: ${AUDIO_TIMEOUT_MS:60000}
    max-retries: ${AUDIO_MAX_RETRIES:2}
    retry-base-ms: ${AUDIO_RETRY_BASE_MS:1000}
    # 单次合成的文本上限（前端按句切片，每片通常 60 字上下）
    max-chars: ${AUDIO_MAX_CHARS:300}
    # 录音上传上限（解码后的 WAV 字节数）：16kHz/单声道/16bit 约 32KB/s，2MB 相当于 60 秒录音
    max-upload-bytes: ${AUDIO_MAX_UPLOAD_BYTES:2097152}
    # 合成结果缓存条数：展厅同一个问题反复被问，命中缓存即省一次外部调用
    tts-cache-size: ${AUDIO_TTS_CACHE_SIZE:64}
    # 单条缓存的字节上限：超过就不入缓存（长文合成能出几 MB，按条数封顶挡不住堆被吃满）
    tts-cache-max-bytes: ${AUDIO_TTS_CACHE_MAX_BYTES:524288}
    # 合成接口独立限流（次/分钟）：一次提问要合成多句，配额比 /api/chat 宽
    synth-rate-per-min: ${AUDIO_SYNTH_RATE_PER_MIN:60}
