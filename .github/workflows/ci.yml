name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # CI 里没有 server/.env，若不显式给阈值，评测/标定会退回代码默认值 3.8，
      # 于是「CI 通过」验的不是线上实际用的阈值。改 .env 时这里必须一起改。
      MIN_RELEVANCE_SCORE: '6.3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 构建（server + web）
        run: npm run build
      - name: 单元测试
        run: npm test -w server
      - name: 检索评测（含闸门漏答检查，不写基线）
        run: npm run eval:retrieval -- --no-write
      - name: 相关性阈值标定（区间必须成立）
        run: npm run calibrate -w server
      - name: 起服务并跑 API 审计
        run: |
          node server/dist/index.js &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8787/api/health >/dev/null && break
            sleep 1
          done
          node server/scripts/api-audit.mjs
        env:
          HOST: 127.0.0.1
          PORT: '8787'
