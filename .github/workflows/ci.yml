name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  backend:
    name: 后端（编译 + 单测 + 检索评测 + 接口冒烟）
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # CI 里没有 server/.env。8.1 现在同时也是代码默认值（application.yml 的 MIN_RELEVANCE_SCORE
      # 与 HybridRetriever.DEFAULT_MIN_KEYWORD_SCORE），显式写出来是为了让"CI 通过的阈值"可见可改；
      # 重新标定后这三处要一起改。
      MIN_RELEVANCE_SCORE: '8.1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 单元测试（不需要 MySQL）
        run: mvn -B -f server/pom.xml test

      - name: 检索评测（同一批用例，不写报告）
        run: mvn -B -q -f server/pom.xml test-compile exec:java@eval -Dexec.args="--no-write"

      - name: 打包
        run: mvn -B -f server/pom.xml -DskipTests package

      - name: 起服务并跑接口冒烟
        run: |
          java -jar server/target/hostess-server.jar --spring.main.banner-mode=off > /tmp/server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8787/api/health >/dev/null && break
            sleep 1
          done
          python3 tools/smoke.py
        env:
          LLM_PROVIDER: mock
          HOST: 127.0.0.1
          PORT: '8787'

      # 边界与安全用例（同一份脚本、同一个跑着的服务）。S16–S18 那组非回环越权需要第二个实例，
      # 这里不设 SECOND_BASE 会标 SKIP——CI 只保证「不该崩、不该漏、不该越权」这批常驻断言不回归。
      - name: 边界与安全用例
        run: python3 tools/security.py
        env:
          HOST: 127.0.0.1
          PORT: '8787'

      - name: 失败时打印服务日志
        if: failure()
        run: tail -80 /tmp/server.log

  frontend:
    name: 前端（类型检查 + 构建 + 单测）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        working-directory: web
        run: npm ci

      - name: 类型检查 + 构建
        working-directory: web
        run: npm run build

      - name: 单测（SSE 解析、问答状态机、朗读切片、播报接线）
        working-directory: web
        run: npm test
